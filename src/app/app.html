<a class="skip-link" href="#main" (click)="$event.preventDefault(); main.focus()">
  {{ 'a11y.skipToContent' | translate }}
</a>

<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" routerLink="/">{{ 'app.title' | translate }}</a>

    <nav [attr.aria-label]="'nav.label' | translate">
      <ul class="nav-list">
        <li><a routerLink="/" fragment="about">{{ 'nav.about' | translate }}</a></li>
        <li><a routerLink="/" fragment="projects">{{ 'nav.projects' | translate }}</a></li>
        <li><a routerLink="/" fragment="contact">{{ 'nav.contact' | translate }}</a></li>
      </ul>
    </nav>

    <app-language-switcher />
  </div>
</header>

<main id="main" #main tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">
    <p>{{ 'footer.text' | translate }}</p>
  </div>
</footer>
